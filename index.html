<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🏆 OMT战队第一赛季 · 德州排行榜</title>
<style>
:root{
  --bg:#071228; --surface:#0d1d3a; --surface2:#152a52; --line:rgba(255,255,255,.09);
  --gold:#e8b94a; --gold2:#f5d67b; --green:#34d399; --red:#f87171; --blue:#60a5fa;
  --text:#f2f5f9; --dim:#93a3bd; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(900px 480px at 50% -8%,rgba(35,80,160,.5),transparent 62%),radial-gradient(rgba(232,185,74,.05) 1px,transparent 1.4px);background-size:auto,22px 22px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:0 14px 92px}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(7,18,40,.92);backdrop-filter:blur(12px);padding:12px 14px 10px;margin:0 -14px 12px;border-bottom:1px solid rgba(232,185,74,.25);display:flex;align-items:center;gap:12px}
.topbar .logo{width:52px;height:52px;border-radius:14px;border:1px solid rgba(232,185,74,.55);box-shadow:0 2px 14px rgba(232,185,74,.25);flex-shrink:0;display:block}
.topbar h1{margin:0;font-size:20px;letter-spacing:.5px;color:var(--gold2)}
.topbar h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
/* 赛季卡 */
.season-card{background:linear-gradient(135deg,#16305e,#0d1d3a);border:1px solid rgba(232,185,74,.45);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.35)}
.season-card::after{content:"♠️";position:absolute;right:10px;top:6px;font-size:64px;opacity:.07;transform:rotate(-12deg)}
.season-card .sname{font-size:17px;font-weight:700;color:var(--gold2)}
.season-card .smeta{color:var(--dim);font-size:13px;margin-top:4px}
.progress{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px}
/* 搜索 */
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;font-size:15px;margin-bottom:12px;outline:none}
.search::placeholder{color:var(--dim)}
/* 排行榜 */
.lb{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:72px}
.lb-row:last-child{border-bottom:none}
.lb-row:active{background:var(--surface2)}
.rank{width:34px;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--dim);flex-shrink:0}
.rank.r1{color:var(--gold2);text-shadow:0 0 12px rgba(232,185,74,.5)}
.rank.r2{color:#c9d2e0}.rank.r3{color:#d29a5b}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:2px solid transparent;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avmini{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-6px;margin-right:2px}
.lb-row.top1{background:linear-gradient(90deg,rgba(232,185,74,.17),transparent 72%)}
.lb-row.top2{background:linear-gradient(90deg,rgba(201,210,224,.11),transparent 72%)}
.lb-row.top3{background:linear-gradient(90deg,rgba(210,154,91,.13),transparent 72%)}
.r1 .avatar{border-color:var(--gold)} .r2 .avatar{border-color:#9aa5b8} .r3 .avatar{border-color:#b07a45}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstats{text-align:right;flex-shrink:0}
.pts{font-size:20px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
.pgames{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.delta{font-size:11px;font-weight:700;margin-left:6px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--dim)}
.chev{color:var(--dim);font-size:14px}
/* 区块标题 */
.sect{font-size:13px;color:var(--dim);letter-spacing:2px;margin:20px 4px 10px;font-weight:600}
/* 玩家详情 sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;transition:transform .3s cubic-bezier(.32,.72,.35,1);padding:18px 18px 30px}
.sheet.open{transform:translate(-50%,0)}
.hero{text-align:center;padding:8px 0 4px;position:relative}
.hero .avatar{width:84px;height:84px;font-size:44px;margin:0 auto 8px;border:3px solid var(--gold)}
.hero h2{margin:0;font-size:22px}
.hero .ptitle{font-size:13px;margin-top:2px}
.hero .bestrank{display:inline-block;margin-top:8px;background:rgba(232,185,74,.14);border:1px solid rgba(232,185,74,.4);color:var(--gold2);font-weight:800;font-size:13px;padding:4px 14px;border-radius:20px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .v.g{color:var(--green)} .stat .v.gold{color:var(--gold2)}
.stat .k{font-size:12px;color:var(--dim);margin-top:2px}
.tierbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.tierbox .t{font-size:13px;font-weight:700;margin-bottom:6px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.badge{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.badge .bi{font-size:26px}
.badge .bn{font-size:11px;margin-top:4px;line-height:1.3}
.badge.locked{opacity:.28;filter:grayscale(1)}
.badge.rare{border-color:rgba(96,165,250,.5)} .badge.legendary{border-color:rgba(232,185,74,.6)}
.gamelog{margin-top:6px}
.grow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.grow:last-child{border-bottom:none}
.grow .gp{font-weight:800;font-variant-numeric:tabular-nums}
.gp.pos{color:var(--green)} .gp.neg{color:var(--red)}
/* 奖品 */
.prize{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.prize .pe{font-size:38px;flex-shrink:0}
.prize .pt{font-weight:800;font-size:16px}
.prize .pd{color:var(--dim);font-size:13px;margin-top:2px}
.prize.top{border-color:rgba(232,185,74,.65);background:linear-gradient(135deg,rgba(245,214,123,.30),rgba(201,150,46,.10) 55%,var(--surface));box-shadow:0 4px 22px rgba(232,185,74,.18)}
/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,22,46,.96);backdrop-filter:blur(12px);border-top:1px solid rgba(232,185,74,.22);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;text-align:center;padding:11px 0 9px;color:var(--dim);text-decoration:none;font-size:11px}
.bottomnav a .ni{font-size:21px;display:block;margin-bottom:2px}
.bottomnav a.active{color:var(--gold2)}
/* 按钮/表单 */
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--gold),#c9962e);color:#1a1405;font-weight:800;border:none;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;margin-top:12px}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.btn.small{padding:9px;font-size:14px;margin-top:8px}
label.f{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px;font-weight:600}
input.f,select.f{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font-size:15px;outline:none}
input.f:focus,select.f:focus{border-color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;white-space:nowrap;background:var(--surface2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:10px 6px;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:rgba(232,185,74,.15);border-color:var(--gold);color:var(--gold2)}
.entry-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.entry-row select{flex:1.4} .entry-row input{flex:1}
.entry-row .rm{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none} .kv b{font-variant-numeric:tabular-nums}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1f2937;border:1px solid var(--gold);color:var(--text);padding:12px 20px;border-radius:12px;z-index:99;transition:transform .3s;font-size:14px;font-weight:600}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
.mode-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.mode-tag.local{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.4)}
.mode-tag.cloud{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.4)}
h2.page{font-size:20px;margin:18px 0 12px;color:var(--gold2)}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
/* 直播榜 / 牌桌 */
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f87171;margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.55)}70%{box-shadow:0 0 0 8px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}
.live-card{background:linear-gradient(135deg,#1a2c52,#0d1d3a);border:1px solid rgba(248,113,113,.5);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 24px rgba(0,0,0,.35)}
.live-card .lt{font-weight:800;font-size:16px}
.live-card .lm{color:var(--dim);font-size:13px;margin-top:3px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;vertical-align:middle}
.pill.on{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.45)}
.pill.off{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.4)}
.desk-row{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.desk-row .dh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.desk-row .dh .avatar{width:38px;height:38px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:rgba(232,185,74,.13);border:1px solid rgba(232,185,74,.45);color:var(--gold2);border-radius:16px;padding:3px 10px;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:active{background:rgba(232,185,74,.3)}
.qb{background:var(--surface);border:1px solid rgba(232,185,74,.5);color:var(--gold2);border-radius:10px;padding:8px 0;font-size:14px;font-weight:800;cursor:pointer;flex:1}
.qb:active{background:rgba(232,185,74,.22)}
.warnbox{background:rgba(250,204,21,.10);border:1px solid rgba(250,204,21,.55);color:#fde68a;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.6}
.okbox{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.4);color:#a7f3d0;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
details.legacy{margin-top:14px}
details.legacy>summary{cursor:pointer;color:var(--dim);font-size:14px;font-weight:700;padding:8px 2px}
/* 渠道切换条 / 玩法速记 / 结算单 */
.chbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chbtn{flex:1;min-width:60px;background:var(--surface);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:700;cursor:pointer}
.chbtn.on{background:rgba(232,185,74,.25);border-color:var(--gold);color:var(--gold2)}
.chip.credit{background:rgba(96,165,250,.13);border-color:rgba(96,165,250,.5);color:#bfdbfe}
.credit-warn{font-size:12px;color:#fde68a;margin-top:2px}
.playrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.playrow:last-child{border-bottom:none}
.stmt{background:var(--surface2);border:1px dashed rgba(232,185,74,.45);border-radius:12px;padding:12px 14px;margin-top:10px}
.stmt .st{font-weight:800;font-size:14px;margin-bottom:6px;color:var(--gold2)}
</style>
</head>

/* ============ 积分引擎 ============ */
function gameResults(game){
  const es = DB.entries.filter(e=>e.game_id===game.id);
  const sorted=[...es].sort((a,b)=>b.profit-a.profit);
  const n=sorted.length, mult=(DB.settings.buyinMult||{})[game.buyin_tier]||1;
  const att=DB.settings.attendancePts ?? 1;
  return sorted.map((e,i)=>{
    let rank=i+1;
    if(i>0 && e.profit===sorted[i-1].profit) rank=sorted._r||i; // 并列名次
    sorted._r=rank;
    return {player_id:e.player_id, profit:e.profit, rank, pts:Math.round((att + Math.max(n-rank+1,0))*mult)};
  });
}
function standings(seasonId){
  const games=DB.games.filter(g=>g.season_id===seasonId&&!isLiveGame(g)).sort((a,b)=>a.date<b.date?-1:1);
  const map={};
  DB.players.filter(p=>p.active).forEach(p=>map[p.id]={player:p,pts:0,games:0,profit:0,wins:0,best:null,ptsArr:[]});
  const perGame=[];
  games.forEach((g,gi)=>{
    const res=gameResults(g); perGame.push({game:g,res});
    res.forEach(r=>{ const s=map[r.player_id]; if(!s) return;
      s.pts+=r.pts; s.games++; s.profit+=r.profit; s.ptsArr.push(r.pts);
      if(r.rank===1) s.wins++;
      if(s.best===null||r.rank<s.best) s.best=r.rank;
      r.gameIdx=gi;
    });
  });
  const rows=Object.values(map).filter(s=>s.games>0)
    .sort((a,b)=>b.pts-a.pts||b.profit-a.profit)
    .map((s,i)=>({...s, rank:i+1}));
  return {rows, games, perGame};
}
function prevStandings(seasonId, uptoIdx){
  const games=DB.games.filter(g=>g.season_id===seasonId&&!isLiveGame(g)).sort((a,b)=>a.date<b.date?-1:1).slice(0,uptoIdx);
  const map={};
  games.forEach(g=>gameResults(g).forEach(r=>{ map[r.player_id]=(map[r.player_id]||0)+r.pts; }));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([pid],i)=>({pid,rank:i+1}));
}
function rankDelta(seasonId, pid, curRank, gameCount){
  if(gameCount<2) return null;
  const prev=prevStandings(seasonId, gameCount-1).find(p=>p.pid===pid);
  if(!prev) return {t:"new"};
  const d=prev.rank-curRank;
  return d>0?{t:"up",n:d}:d<0?{t:"down",n:-d}:{t:"flat"};
}
function titleFor(rank,games){
  if(rank===1&&games>=3) return "牌桌之王";
  if(rank<=3) return "大亨";
  if(rank<=6) return "悍将";
  return "新锐";
}

/* ============ 徽章引擎 ============ */
function awardBadge(pid,bid,gameId){
  if(DB.player_badges.some(b=>b.player_id===pid&&b.badge_id===bid)) return false;
  const row={player_id:pid,badge_id:bid,game_id:gameId||null,awarded_at:new Date().toISOString()};
  DB.player_badges.push(row); dbPut("player_badges",row); return true;
}
function checkBadges(seasonId, game){
  const {rows,perGame}=standings(seasonId);
  const wl=DB.settings.whaleLine||800;
  const newly=[];
  const give=(pid,bid)=>{ if(awardBadge(pid,bid,game?game.id:null)) newly.push({pid,bid}); };
  rows.forEach(s=>{
    const pid=s.player.id;
    if(s.games>=1) give(pid,"debut");
    if(s.games>=10) give(pid,"ironman");
    if(s.pts>=100) give(pid,"hundred");
    if(s.wins>=1) give(pid,"mvp");
    if(s.wins>=3) give(pid,"win3");
    const p=DB.players.find(x=>x.id===pid);
    if(p&&DB.players.some(x=>x.referrer_id===pid)) give(pid,"referrer");
  });
  // 首秀前三
  perGame.forEach(({game:g,res},gi)=>{
    res.forEach(r=>{
      const prevGames=perGame.slice(0,gi).some(pg=>pg.res.some(x=>x.player_id===r.player_id));
      if(!prevGames){ if(r.rank<=3) give(r.player_id,"debut3"); }
      if(r.profit>=wl) give(r.player_id,"whale");
    });
  });
  // 连胜 / 稳定：按时间顺序看每场是否进前一半
  rows.forEach(s=>{
    const pid=s.player.id;
    const seq=perGame.map(({res})=>{ const r=res.find(x=>x.player_id===pid); if(!r) return null;
      return r.rank<=Math.ceil(res.length/2); });
    const lastN=n=>seq.slice(-n).every(Boolean)&&seq.slice(-n).length===n;
    if(lastN(3)) give(pid,"streak3");
    if(lastN(5)) give(pid,"steady");
  });
  return newly;
}
function playerBadges(pid){ return DB.player_badges.filter(b=>b.player_id===pid).map(b=>b.badge_id); }

/* ============ 实时牌局引擎（buy in / cash out） ============
   数据扩展（兼容既有结构）：
   - games 增加 status："live"=进行中；"finished" 或缺省=已结束（历史数据无此字段，一律按已结束处理）
   - games 增加 rake:number（本场水费，缺省 0）、plays:[]（玩法速记 {id,type,player_id,at}，缺省 []）
   - 进行中场次的 entries 增加：buyins:流水数组、cash_out:number|null（null=还在桌上）
   - buyins 流水元素现为对象 {amt, ch, paid}：ch=支付渠道（见 CHANNELS），paid=false 仅出现在挂账未结清时；
     历史纯数字元素自动迁移为 {amt, ch:"cash", paid:true}（见 migrateBuyins），所有读取都经 buyinAmt/buyinCh/buyinPaid 兼容两种形态
   - 结算时把最终盈亏写回 entry.profit，既有积分/徽章/统计逻辑完全不用改 */
const CHANNELS=[
  {id:"wechat",   label:"微信", short:"微信"},
  {id:"alipay",   label:"支付宝", short:"支付宝"},
  {id:"cash",     label:"现金", short:"现金"},
  {id:"transfer", label:"转账", short:"转账"},
  {id:"credit",   label:"挂账", short:"挂账"},
];
const chOf=id=>CHANNELS.find(c=>c.id===id)||CHANNELS[2];
const buyinAmt = b => typeof b==="number" ? b : (parseFloat(b&&b.amt)||0);
const buyinCh  = b => (b&&typeof b==="object"&&b.ch) ? b.ch : "cash";
const buyinPaid= b => (b&&typeof b==="object") ? b.paid!==false : true;
/* 玩法速记类型：feed=玩家端动态文案；鱿鱼只记录展示，炸弹/同花顺/皇家同花顺结算时自动发券 */
const PLAY_TYPES=[
  {id:"squid", icon:"🦑", label:"鱿鱼获胜", feed:"拿下鱿鱼"},
  {id:"bomb",  icon:"💣", label:"炸弹",     feed:"开出炸弹"},
  {id:"flush", icon:"🃏", label:"同花顺",   feed:"开出同花顺"},
  {id:"royal", icon:"👑", label:"皇家同花顺", feed:"开出皇家同花顺"},
];
const playOf=id=>PLAY_TYPES.find(t=>t.id===id)||PLAY_TYPES[0];
const isLiveGame = g => !!g && g.status==="live";
const gameEntries = gid => DB.entries.filter(e=>e.game_id===gid);
function liveGameOf(seasonId){ return DB.games.find(g=>g.season_id===seasonId && isLiveGame(g)) || null; }
function buyinTotal(e){ return (e.buyins||[]).reduce((a,b)=>a+buyinAmt(b),0); }
function entrySettled(e){ return e.cash_out!==null && e.cash_out!==undefined && e.cash_out!==""; }
function liveProfit(e){ return entrySettled(e) ? parseFloat(e.cash_out)-buyinTotal(e) : null; }
/* 旧对账口径（保留备用）：只统计已离场（已填 cash out）的玩家盈亏；在桌玩家暂不计入 */
function settledProfitSum(game){ return gameEntries(game.id).filter(entrySettled).reduce((a,e)=>a+liveProfit(e),0); }
/* 新对账口径（水费）：差额 = ∑全部买入 − ∑已离场 cash out − 本场水费。
   在桌未离场者尚无 cash out、不计入带出，其买入仍在桌上，故差额要等全员离场后才应为 0 */
function balanceDiff(game){
  const es=gameEntries(game.id);
  const tb=es.reduce((a,e)=>a+buyinTotal(e),0);
  const co=es.filter(entrySettled).reduce((a,e)=>a+(parseFloat(e.cash_out)||0),0);
  return tb-co-(parseFloat(game.rake)||0);
}
/* 挂账：某玩家全部场次未结清的挂账买入合计（渠道=挂账且未结清） */
function unpaidCredit(pid){
  let sum=0;
  DB.entries.filter(e=>e.player_id===pid).forEach(e=>(e.buyins||[]).forEach(b=>{
    if(buyinCh(b)==="credit"&&!buyinPaid(b)) sum+=buyinAmt(b);
  }));
  return sum;
}
/* 挂账汇总（后台挂账视图用）：按玩家聚合未结笔数与总额 */
function creditRows(){
  const map={};
  DB.entries.forEach(e=>(e.buyins||[]).forEach(b=>{
    if(buyinCh(b)==="credit"&&!buyinPaid(b)){
      const m=map[e.player_id]||(map[e.player_id]={count:0,total:0});
      m.count++; m.total+=buyinAmt(b);
    }
  }));
  return Object.entries(map)
    .map(([pid,m])=>({player:DB.players.find(x=>x.id===pid), ...m}))
    .filter(x=>x.player).sort((a,b)=>b.total-a.total);
}
/* 玩法结算联动：炸弹→bomb 券、同花顺/皇家同花顺→flush 券（张数读既有发券规则，默认 2/4）；鱿鱼不发券 */
function playTicketGrants(game){
  const out=[];
  (game.plays||[]).forEach(pl=>{
    if(pl.type==="bomb") out.push({player_id:pl.player_id, reason:"bomb", count:ticketRule("bomb")});
    else if(pl.type==="flush"||pl.type==="royal") out.push({player_id:pl.player_id, reason:"flush", count:ticketRule("flush")});
  });
  return out;
}
/* 本场结算单数据：按渠道汇总买入 + 水费 + 对账差额（全员有离场记录时才给差额，旧数据为 null） */
function gameStatement(g){
  const es=gameEntries(g.id);
  const byCh={}; CHANNELS.forEach(c=>byCh[c.id]=0);
  let hasBuy=false, total=0;
  es.forEach(e=>(e.buyins||[]).forEach(b=>{ hasBuy=true; const a=buyinAmt(b); byCh[buyinCh(b)]+=a; total+=a; }));
  const allSettled=es.length>0&&es.every(entrySettled);
  return { byCh, hasBuy, total, rake:parseFloat(g.rake)||0, diff: allSettled? balanceDiff(g): null };
}
/* 荣誉榜（由已结算赛季数据自动统计，零录入）：水上王=累计盈利最高 / 水下守护者=累计亏损最多 / 到场王=参赛场次最多 */
function honors(seasonId){
  const {rows}=standings(seasonId);
  if(!rows.length) return null;
  const byProfit=[...rows].sort((a,b)=>b.profit-a.profit);
  const byGames=[...rows].sort((a,b)=>b.games-a.games||b.profit-a.profit);
  return { waterKing:byProfit[0], guardian:byProfit[byProfit.length-1], ironman:byGames[0] };
}
/* 数据迁移：把历史纯数字 buyins 流水转为对象形态，并补齐新字段默认值。返回是否有 entries 被迁移（云端需回写） */
function migrateBuyins(){
  let changed=false;
  (DB.entries||[]).forEach(e=>{
    if(!Array.isArray(e.buyins)) return;
    e.buyins=e.buyins.map(b=>{
      if(typeof b==="number"){ changed=true; return {amt:b, ch:"cash", paid:true}; }
      if(b&&typeof b==="object"&&b.paid===undefined){ b.paid = b.ch==="credit" ? false : true; }
      return b;
    });
  });
  (DB.games||[]).forEach(g=>{ if(g.plays===undefined) g.plays=[]; if(g.rake===undefined) g.rake=0; });
  if(DB.settings&&DB.settings.creditLimit==null) DB.settings.creditLimit=3000;
  return changed;
}
function newLiveGame(seasonId, date, tier, pids){
  const g={id:uid(), season_id:seasonId, date, buyin_tier:tier, status:"live", rake:0, plays:[], created_at:new Date().toISOString()};
  DB.games.push(g);
  pids.forEach(pid=>DB.entries.push({id:uid(), game_id:g.id, player_id:pid, profit:0, buyins:[], cash_out:null}));
  return g;
}
function applyBuyin(e, amt, ch){
  e.buyins=e.buyins||[];
  const c=chOf(ch).id;
  e.buyins.push({amt, ch:c, paid:c!=="credit"});
}
function settleGame(game){
  gameEntries(game.id).forEach(e=>{ e.profit=(entrySettled(e)?parseFloat(e.cash_out):0)-buyinTotal(e); });
  game.status="finished"; game.finished_at=new Date().toISOString();
  return gameResults(game);
}

}

async function saveEntryRow(e){ await dbPut("entries",e).catch(()=>{}); await persist(); }

async function startLiveGame(){
  const seasonId=$("#nSeason").value, date=$("#nDate").value||todayStr(), tier=$("#nTier").value;
  const pids=[...document.querySelectorAll("#nPlayers input:checked")].map(c=>c.value);
  if(pids.length<2){ toast("至少选 2 位玩家入座"); return; }
  const exist=liveGameOf(seasonId);
  if(exist){ toast("本赛季已有一场进行中，先结束它"); deskGameId=exist.id; renderAdmin(); return; }
  const g=newLiveGame(seasonId,date,tier,pids);
  await saveGameRow(g);
  for(const e of gameEntries(g.id)) await dbPut("entries",e).catch(()=>{});

  deskGameId=g.id; toast("🔴 开局！开始实时记录买入"); renderAdmin();

async function finishLiveGame(gid){
  const g=DB.games.find(x=>x.id===gid); if(!g||!isLiveGame(g)) return;
  const es=gameEntries(g.id);
  /* 对账差额 ≠ 0 先弹确认（写明差额），不硬锁 */
  const diff=balanceDiff(g);
  if(Math.round(diff)!==0){
    if(!confirm(`⚠️ 对账差额 ${diff>0?"+":"−"}$${Math.abs(Math.round(diff)).toLocaleString()}（全部买入 − 已离场带出 − 本场水费 $${(parseFloat(g.rake)||0).toLocaleString()}），不为 0。\n多半是买入或离场金额漏记/错记。仍要结束本场并结算吗？`)) return;
  }
  const unset=es.filter(e=>!entrySettled(e));
  if(unset.length){
    const names=unset.map(e=>DB.players.find(p=>p.id===e.player_id)?.name||"?").join("、");
    if(!confirm(`还有 ${unset.length} 人没填 cash out：${names}。未填的一律按 0（输光离场）结算，确定结束本场？`)) return;
  }
  const res=settleGame(g);
  await saveGameRow(g);
  for(const e of es) await saveEntryRow(e);
  const grants=await grantPlayTickets(g);
  const newly=checkBadges(g.season_id,g); await persist();
  deskGameId=null;
  const champ=DB.players.find(p=>p.id===res[0]?.player_id);
  const tkN=grants.reduce((a,x)=>a+x.count,0);
  toast(`🏁 本场已结算！冠军 ${champ?.name||""}${tkN?` · 🎟️ 玩法自动发券 ${tkN} 张`:""}${newly.length?` · 🏅 新徽章 ×${newly.length}`:""}`);

}

function compressAvatar(file, cb){
  if(!file){ cb(null); return; }
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ try{
      const S=128, c=document.createElement("canvas"); c.width=S; c.height=S;
      const x=c.getContext("2d"); const sc=Math.max(S/img.width,S/img.height);
      const w=img.width*sc, h=img.height*sc;
      x.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg",0.85));
    }catch(e){ cb(null); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); cb(null); };
  img.src=url;
}
function onNewAvatarFile(input){
  compressAvatar(input.files&&input.files[0], url=>{
    if(url){ pendingImg=url; const pv=$("#pImgPrev"); if(pv) pv.innerHTML=`<img class="avmini" style="width:38px;height:38px" src="${url}">`; toast("照片已选，添加后生效"); }

    input.value="";
  });

async function saveSettings(){
  const mult={}; $("#setMult").value.split(",").forEach(p=>{ const [k,v]=p.split(":").map(s=>s.trim()); if(k&&v) mult[k]=parseFloat(v)||1; });
  DB.settings.attendancePts=parseInt($("#setAtt").value)||1;
  DB.settings.buyinMult=mult; DB.settings.whaleLine=parseInt($("#setWhale").value)||800;
  DB.settings.creditLimit=parseInt($("#setCredit")?.value); if(isNaN(DB.settings.creditLimit)||DB.settings.creditLimit<0) DB.settings.creditLimit=3000;
  await dbPut("settings",{key:"_bundle",value:DB.settings}).catch(()=>{});
  if(STORE.mode==="cloud") for(const [k,v] of Object.entries(DB.settings)) await supa.from("settings").upsert({key:k,value:v});
  await persist(); toast("规则已保存");
}
async function savePw(){ const v=$("#setPw").value.trim(); if(!v) return;
  DB.settings.adminPw=v; await persist();
  if(STORE.mode==="cloud") await supa.from("settings").upsert({key:"adminPw",value:v});
  toast("密码已更新"); }
async function saveSupa(){
  localStorage.setItem("walnut_s4_sb_url",$("#sbUrl").value.trim());
  localStorage.setItem("walnut_s4_sb_key",$("#sbKey").value.trim());
  location.reload();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="walnut-s4-backup.json"; a.click(); toast("已导出");
}
function exportSQL(){
  const sql=`-- 在 Supabase SQL Editor 里运行一次\ncreate table if not exists players(id text primary key,name text,avatar text,img text,title text,referrer_id text,active boolean);\ncreate table if not exists seasons(id text primary key,name text,games_count int,status text,start_date date,end_date date);\ncreate table if not exists games(id text primary key,season_id text,date date,buyin_tier text,status text,rake numeric,plays jsonb);\nalter table games add column if not exists rake numeric;\nalter table games add column if not exists plays jsonb;\ncreate table if not exists entries(id text primary key,game_id text,player_id text,profit numeric,buyins jsonb,cash_out numeric);\ncreate table if not exists player_badges(player_id text,badge_id text,game_id text,awarded_at timestamptz,primary key(player_id,badge_id));\ncreate table if not exists tickets(id text primary key,season_id text,game_id text,player_id text,reason text,count int,note text,drawn boolean,created_at timestamptz);\ncreate table if not exists draws(id text primary key,season_id text,prize text,winner_pid text,ticket_id text,pool_size int,seed text,created_at timestamptz);\ncreate table if not exists settings(key text primary key,value jsonb);\nalter table players enable row level security;alter table seasons enable row level security;alter table games enable row level security;alter table entries enable row level security;alter table player_badges enable row level security;alter table settings enable row level security;\ncreate policy "open" on players for all using(true) with check(true);\ncreate policy "open" on seasons for all using(true) with check(true);\ncreate policy "open" on games for all using(true) with check(true);\ncreate policy "open" on entries for all using(true) with check(true);\ncreate policy "open" on player_badges for all using(true) with check(true);\ncreate policy "open" on tickets for all using(true) with check(true);\ncreate policy "open" on draws for all using(true) with check(true);\ncreate policy "open" on settings for all using(true) with check(true);`;
  navigator.clipboard.writeText(sql).then(()=>toast("建表 SQL 已复制")).catch(()=>prompt("复制这段 SQL:",sql));
}

/* --- 抽奖券管理 --- */
function tabTickets(){
  const s=activeSeason(); if(!s){ $("#atab").innerHTML=`<div class="empty">还没有赛季</div>`; return; }
  const totals=ticketTotals(s.id);
  const games=DB.games.filter(g=>g.season_id===s.id).sort((a,b)=>a.date<b.date?-1:1);
  const players=DB.players.filter(p=>p.active);
  const ledger=seasonTickets(s.id).slice().sort((a,b)=>a.created_at<b.created_at?1:-1);
  const pName=pid=>esc(DB.players.find(p=>p.id===pid)?.name||"?");
  const poolTotal=Object.values(totals).reduce((a,e)=>a+e.total,0);
  $("#atab").innerHTML=`
  <div class="card"><h3>➕ 发券</h3>
    <label class="f">玩家（多选）</label>
    <div id="tkPlayers" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">
      ${players.map(p=>`<label style="display:flex;align-items:center;gap:6px;font-size:14px"><input type="checkbox" value="${p.id}"> ${avMini(p)}${esc(p.name)}</label>`).join("")}</div>
    <label class="f">理由</label><select class="f" id="tkReason" onchange="tkReasonChg()">${TICKET_REASONS.map(r=>`<option value="${r.id}">${r.icon} ${esc(r.label)}（${r.scope==="game"?"按场":"赛季级"}）</option>`).join("")}</select>
    <label class="f">场次</label><select class="f" id="tkGame"><option value="">— 赛季级 —</option>${games.map(g=>`<option value="${g.id}">${esc(g.date)}${isLiveGame(g)?" · 进行中":""}</option>`).join("")}</select>
    <label class="f">张数</label><input class="f" type="number" id="tkCount" value="1" min="1">
    <label class="f">备注（可选）</label><input class="f" id="tkNote" placeholder="如：新人小王">
    <button class="btn" onclick="addTickets()">🎟️ 发券</button></div>
  <div class="sect">📊 本赛季统计（${poolTotal} 张）</div>
  ${Object.entries(totals).sort((a,b)=>b[1].total-a[1].total).map(([pid,t])=>
    `<div class="kv"><span>${pName(pid)} · ${Object.entries(t.byReason).map(([rid,c])=>reasonOf(rid).icon+"×"+c).join(" ")}</span><b style="color:var(--gold2)">${t.total} 券</b></div>`).join("")||'<div class="empty">还没发过券</div>'}
  <div class="card"><h3>🎲 公开抽奖</h3>
    <label class="f">本轮奖品</label><input class="f" id="dPrize" placeholder="如：一等奖 iPhone 折叠屏">
    <label class="f">抽出几位</label><input class="f" type="number" id="dN" value="1" min="1">
    <div class="note">按券数加权随机抽取：券越多，被抽中概率越高。每位玩家每轮最多中一次，中奖者的其余券退出本轮券池。开奖记录公开可查。</div>
    <button class="btn" onclick="doDraw()">🎲 开奖</button>
    <div id="drawRes"></div></div>
  <div class="card"><h3>🧾 发放明细</h3>
    ${ledger.map(t=>`<div class="kv"><span>${reasonOf(t.reason).icon} ${pName(t.player_id)} <span style="color:var(--dim);font-size:12px">${esc((t.created_at||"").slice(0,10))}${t.note?" · "+esc(t.note):""}${t.drawn?' · <span style="color:var(--green)">已开奖</span>':""}</span></span>
      <span><b>+${t.count}</b> <button class="rm" onclick="delTicket('${t.id}')">×</button></span></div>`).join("")||'<div class="empty">暂无</div>'}</div>
  <div class="card"><h3>⚙️ 发券规则（每种理由默认张数）</h3>
    ${TICKET_REASONS.map(r=>`<label class="f" style="display:flex;justify-content:space-between;align-items:center">${r.icon} ${esc(r.label)}<input class="f" style="width:80px;margin:0" type="number" min="0" id="rule_${r.id}" value="${ticketRule(r.id)}"></label>`).join("")}
    <button class="btn" onclick="saveTicketRules()">保存规则</button></div>`;
  tkReasonChg();
}
function tkReasonChg(){
  const rid=$("#tkReason").value; $("#tkCount").value=ticketRule(rid);
  if(reasonOf(rid).scope==="season") $("#tkGame").value="";
  else if(!$("#tkGame").value && $("#tkGame").options.length>1) $("#tkGame").value=$("#tkGame").options[$("#tkGame").options.length-1].value;
}
async function addTickets(){
  const s=activeSeason();
  const pids=[...document.querySelectorAll("#tkPlayers input:checked")].map(c=>c.value);
  const reason=$("#tkReason").value, count=parseInt($("#tkCount").value)||1;
  const gameId=$("#tkGame").value||null, note=$("#tkNote").value.trim();
  if(!pids.length){ toast("先选玩家"); return; }
  if(reasonOf(reason).scope==="game"&&!gameId){ toast("选一场次"); return; }
  for(const pid of pids){
    const t={id:uid(),player_id:pid,season_id:s.id,game_id:gameId,reason,count,note,drawn:false,created_at:new Date().toISOString()};
    DB.tickets.push(t); await dbPut("tickets",t);
  }
  await persist(); toast(`已发 ${pids.length} 人 × ${count} 券`); tabTickets();
}
async function delTicket(id){
  const t=(DB.tickets||[]).find(x=>x.id===id); if(!t) return;
  if(!confirm(`删除这条发券记录？(${DB.players.find(p=>p.id===t.player_id)?.name} +${t.count})`)) return;
  DB.tickets=DB.tickets.filter(x=>x.id!==id); await dbDel("tickets",id); await persist(); tabTickets();
}
async function saveTicketRules(){
  DB.settings.ticketRules=DB.settings.ticketRules||{};
  TICKET_REASONS.forEach(r=>{ const v=parseInt($("#rule_"+r.id).value); DB.settings.ticketRules[r.id]=isNaN(v)?DEFAULT_TICKETS[r.id]:v; });
  await persist(); toast("发券规则已保存"); tabTickets();
}
async function doDraw(){
  const s=activeSeason(); const prize=$("#dPrize").value.trim(); const n=Math.max(1,parseInt($("#dN").value)||1);
  if(!prize){ toast("填奖品名"); return; }
  const pool=(DB.tickets||[]).filter(t=>t.season_id===s.id&&!t.drawn);
  if(!pool.length){ toast("本赛季没有可抽的券"); return; }
  const poolSize=pool.reduce((a,t)=>a+t.count,0);
  let entries=[]; pool.forEach(t=>{ for(let i=0;i<t.count;i++) entries.push(t); });
  const rnd=()=>{ const b=new Uint32Array(1); crypto.getRandomValues(b); return b[0]/4294967296; };
  const seedHex=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const winners=[];
  while(winners.length<n&&entries.length){
    const pick=entries[Math.floor(rnd()*entries.length)];
    winners.push(pick);
    entries=entries.filter(e=>e.player_id!==pick.player_id);
  }
  const now=new Date().toISOString();
  for(const w of winners){
    w.drawn=true; await dbPut("tickets",w);
    const d={id:uid(),season_id:s.id,prize,winner_pid:w.player_id,ticket_id:w.id,pool_size:poolSize,seed:seedHex,created_at:now};
    DB.draws.push(d); await dbPut("draws",d);
  }
  await persist();
  const nm=pid=>esc(DB.players.find(p=>p.id===pid)?.name||"?");
  $("#drawRes").innerHTML=`<div class="card" style="margin-top:10px"><h3>🎉 开奖结果</h3>
    ${winners.map((w,i)=>`<div class="kv"><span>第 ${i+1} 位 · <b>${nm(w.player_id)}</b></span><span style="color:var(--gold2)">🏆 ${esc(prize)}</span></div>`).join("")}
    <div class="note">券池 ${poolSize} 张 · 随机种子 ${seedHex} · 已公开记录</div></div>`;
  toast("开奖完成！");
}

/* ============ 路由 ============ */
function router(){
  const h=location.hash||"#/";
  document.querySelectorAll("#bottomnav a").forEach(a=>a.classList.remove("active"));
  if(h.startsWith("#/prizes")){ $("[data-nav=prizes]").classList.add("active"); renderPrizes(); }
  else if(h.startsWith("#/live")){ $("[data-nav=live]").classList.add("active"); renderLive(); }
  else if(h.startsWith("#/tickets")){ $("[data-nav=tickets]").classList.add("active"); renderTickets(); }
  else if(h.startsWith("#/admin")){ $("[data-nav=admin]").classList.add("active"); renderAdmin(); }
  else{ $("[data-nav=board]").classList.add("active"); renderBoard(); }
  window.scrollTo(0,0);
}

/* ============ 云端模式自动刷新（玩家侧实时看） ============ */
let pollStarted=false;
async function cloudRefresh(){
  if(STORE.mode!=="cloud") return;
  if(location.hash.startsWith("#/admin")) return;               // 后台录入中不打扰
  if($("#sheet")?.classList.contains("open")) return;            // 详情弹层打开时不刷新
  const q=$("#q"); if(q&&document.activeElement===q) return;     // 正在搜索时不刷新
  try{ DB=await STORE.load(); router(); }catch(e){}
}
function startPolling(){
  if(pollStarted||STORE.mode!=="cloud") return;
  pollStarted=true;
  setInterval(()=>{ if(!document.hidden) cloudRefresh(); }, 12000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) cloudRefresh(); });
}

/* ============ 启动 ============ */
(async function init(){
  await initSupa();
  STORE = supa ? Cloud : Local;
  DB = await STORE.load();
  // 数据迁移：历史纯数字 buyins 流水 → {amt, ch:"cash", paid:true} 对象形态；补齐 games.rake/plays 与 settings.creditLimit
  const migrated=migrateBuyins();
  if(migrated&&STORE.mode==="cloud"){ for(const e of DB.entries) await dbPut("entries",e).catch(()=>{}); }
  // 赛季信息校正：OMT战队第一赛季日期固定为 2026-10-25 至 2026-11-30
  (DB.seasons||[]).forEach(s=>{ if(s.name==="OMT战队第一赛季"||s.id==="s4"){ s.start_date="2026-10-25"; s.end_date="2026-11-30"; } });
  if(!DB.settings) DB.settings={adminPw:"walnut888",attendancePts:1,buyinMult:{"标准":1,"深筹":1.5,"豪客":2},whaleLine:800,creditLimit:3000};
  if(DB.settings.creditLimit==null) DB.settings.creditLimit=3000;
  DB.tickets=DB.tickets||[]; DB.draws=DB.draws||[];
  if(!DB.settings.ticketRules) DB.settings.ticketRules={...DEFAULT_TICKETS};
  // 演示奖品若从未改动过（旧赛季排名奖品），换成新赛季抽奖奖品结构
  try{
    const oldPrizes=[{e:"🏆",t:"赛季总冠军",d:"iPhone 17 Pro Max，或等值现金 $1,200（二选一）",top:1},{e:"🥈",t:"亚军",d:"茅台飞天 53° × 2 瓶",top:1},{e:"🥉",t:"季军",d:"$500 Visa 卡",top:0},{e:"🎖️",t:"第 4–6 名",d:"$200 – $300 现金或礼卡",top:0},{e:"📅",t:"全勤奖",d:"定制筹码套装 或 $100（12 场全到）",top:0},{e:"🧭",t:"推荐奖",d:"每带来一位新人，奖励 $50",top:0},{e:"⚡",t:"单场最佳",d:"当场发放小奖：红酒 / 耳机 / 茶叶",top:0}];
    if(JSON.stringify(DB.prizes)===JSON.stringify(oldPrizes)) DB.prizes=seedData().prizes;
  }catch(e){}
  await persist();
  const s=activeSeason();
  if(s){ checkBadges(s.id); await persist(); }
  router();
  startPolling();
})();
